{% extends 'home.html' %}
{% block page_content %}
<h2>Categories</h2>
<div class="records">
{% for category in categories %}
    <p>{{ category.name }}</p>
{% endfor %}
</div>
<h2>Add Category</h2>
<form method="post">
    {% csrf_token %}
    Category
    <input type="text" name="name" required>   
    <button type="submit">Add category</button>
</form>
{% for field, messages in errors.items %}{% for m in messages %}<p class="error">{{ m }}</p>{% endfor %}{% endfor %}

{% endblock %}
